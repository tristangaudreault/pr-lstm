program: experiments/main.py
method: grid
parameters:
  model:
    value: chorus_rnn
  task:
    value: parity_check
  training-steps:
    value: 2500
  hidden-size:
    values: [4, 8, 16, 32, 64, 128]
  outer-hidden-size:
    values: [4, 8, 16, 32, 64, 128]
metric:
  name: test/accuracy
  goal: maximize
command:
  - venv/Scripts/python
  - ${program}
  - ${args}
