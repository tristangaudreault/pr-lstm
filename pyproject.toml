[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thesis"
version = "0.2.0"
dependencies = [
  "dm-haiku",
  "jax[cuda12] ; sys_platform == 'linux'",
  "jax ; sys_platform != 'linux'",
  "dotenv",
  "wandb",
  "einops",
  "absl-py",
  "dm-tree",
  "einshape @ git+https://github.com/deepmind/einshape",
  "optax",
  "tqdm",
  "typing-extensions",
  "flax",
  "pluggy",
  "sympy",
]
authors = [
  { name = "Tristan Gaudreault", email = "tristan@tristangaudreault.com" },
]
description = "The collection of source code used in my thesis"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/tristangaudreault/thesis"
Issues = "https://github.com/tristangaudreault/thesis/issues"
